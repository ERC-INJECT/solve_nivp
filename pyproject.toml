[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solve_nivp"
version = "0.2.1.dev3"
description = "A Python toolkit for integrating nonsmooth dynamical systems"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "David Riley" },
  { name = "Ioannis Stefanou" },
]
keywords = [
  "nonsmooth dynamics",
  "ODE",
  "DAE",
  "variational inequalities",
  "semismooth Newton",
  "projection methods",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.8",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]
rl = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.2",
  "sb3-contrib>=2.2",
  "matplotlib>=3.5",
]
docs = [
  "sphinx>=6",
  "sphinx-rtd-theme>=1.2",
]
petsc = [
  "petsc4py>=3.20",
]
accel = [
  "numba>=0.58",
]
all = [
  "petsc4py>=3.20",
  "numba>=0.58",
  "gymnasium>=0.29",
  "stable-baselines3>=2.2",
  "sb3-contrib>=2.2",
  "matplotlib>=3.5",
]

[project.scripts]
solve_nivp-selftest = "solve_nivp._selftest:main"

[project.urls]
Homepage = "https://github.com/ERC-INJECT/solve_nivp"
Documentation = "https://github.com/ERC-INJECT/solve_nivp/tree/main/docs"
Issues = "https://github.com/ERC-INJECT/solve_nivp/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["solve_nivp*"]
exclude = ["tests*"]
